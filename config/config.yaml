# ==============================================================================
# GLOBAL SYSTEM CONFIGURATION
# ==============================================================================

# Total number of fertilizer channels (coils) to control
n: 5

# ------------------------------------------------------------------------------
# Intel RealSense Camera Configurations
# ------------------------------------------------------------------------------
realsense:
  # Unique hardware serial numbers for each camera device
  camera1:
    serial: "419222301921"
  camera2:
    serial: "353522302286"
  camera3:
    serial: "409122301544"
  camera4:
    serial: "408222300679"
  camera5:
    serial: "353522301659"
  
  # Video stream capture settings
  fps: 15
  color_res:
    x: 640
    y: 360
  infrared_res:
    x: 640
    y: 360
  
  # Enable TTY terminal emulation for serial communication
  emulate_tty: true

  # Colour exposure of the D555. null (default) keeps the camera's auto exposure, as before.
  # Auto exposure lengthens the exposure in low light, and the resulting motion blur is what
  # makes the YOLO model call bare soil "cane" (blurred day session and night passes). A fixed
  # value disables auto exposure. Units are the driver's: check the range with
  #   ros2 param describe /camera1/camera1 rgb_camera.exposure
  # Target: under ~3 ms (about 2 px of blur at 10 km/h, 0.38 cm/px), so the blur_median the
  # inference node publishes stays near its daylight value (~0.8). If the image is too dark,
  # raise rgb_gain or the lights, not the exposure.
  rgb_exposure: null
  rgb_gain: null

  # Optional staggered start: camera i starts (i-1)*startup_stagger_s seconds after launch.
  # 0 (default) starts all cameras at once, as before. Try e.g. 5.0 if the USB 3.2 cameras
  # fail to connect when started together.
  startup_stagger_s: 0.0

# ------------------------------------------------------------------------------
# Perception pipeline
# ------------------------------------------------------------------------------
# "yolo"  : YOLO26 classifier (cv_inference cameraNode + inference_node)
# "index" : colour/NDVI index masks (processing_pipeline + ndvi_threshold per camera)
# "both"  : both pipelines run on the same frames; valve_source decides which one drives
#           the valves, the other is only published (/detection/Trigger or /threshold<i>)
#           so the two can be compared on identical frames.
# Both can be overridden at launch: ros2 launch fertilizer launch_nodes.py perception:=both
perception: yolo
valve_source: yolo

# YOLO inference node (perception: yolo | both)
yolo:
  # "" keeps the node's default engine (cv_inference src/best.engine)
  engine_path: ""
  # Pass-condition switch: while the median blur ratio of a camera's last blur_window frames
  # is below blur_threshold, that camera is decided by this second engine (the model trained
  # on ExG labels, plant_fallback.engine). "" disables the switch.
  fallback_engine_path: ""
  blur_threshold: 0.561
  blur_window: 30
  # p(plant) >= plant_threshold opens the valves. 0.5 = argmax (as before). With the E12 model,
  # 0.3 gave 94.5 % at night (93.0 % at 0.5) and 96.3 % by day, and leaves less cane without vinasse.
  plant_threshold: 0.5

# ------------------------------------------------------------------------------
# Index pipeline (perception: index | both)
# ------------------------------------------------------------------------------
# Region of Interest (ROI) for NDVI calculation. Defined as a rectangle with top-left corner (x, y) and width w and height h.
roi:
  w: 50
  h: 19 #deberia ser 30

# Optional infrared-to-color alignment.  Provide a 3x3 homography that
# transforms a pixel in the infra image into the corresponding location in
# the color image.  Enable with `enabled: true`.
alignment:
  enabled: false            # set false to disable alignment
  dynamic: false            # set true to compute matrix each frame via RANSAC
#  matrix:
#    - [0.9831507938138508, 0.12790548763982962, -23.771485967610094]
#    - [-0.0011711747631751497, 1.0532434875127477, -7.306811121913817]
#    - [7.450940389429025e-06, 0.0001266612145956316, 1.0]

# Index thresholds: ndvi_threshold publishes 1.0 on /threshold<i> if the index average is
# above the threshold, else 0.0
egx_threshold: 0.501
threshold: 0.02
index: "ndvi" #can also be "egx" for testing with EGX index instead of NDVI

# ------------------------------------------------------------------------------
# ROS 2 Launch Configurations
# ------------------------------------------------------------------------------
# Automatically restart nodes if they crash unexpectedly
respawn: true
# Delay (in seconds) before attempting to restart a crashed node
respawn_delay: 5

# ------------------------------------------------------------------------------
# Modbus TCP Server Settings
# ------------------------------------------------------------------------------
modbus:
  host: "192.168.11.60"
  port: 502
  
  # Automatically open connection on startup
  auto_open: true
  
  # Debounce time in microseconds (minimum accepted interval between coil state changes)
  debounce_time : 500000 

  # PLC watchdog heartbeat. When set, this coil is toggled every heartbeat_period_ms; the
  # LOGO! program must AND every valve output with an off-delay timer (~1 s) retriggered by
  # each heartbeat edge, so the valves fall back to their de-energised state (application
  # open, return closed) if this node, the Jetson or the network stops. Leave it commented
  # out until the coil address exists in the LOGO! program: writing an unused address may
  # drive another output.
  # heartbeat_coil : 10
  # heartbeat_period_ms : 200

  # Mapping of cameras to their respective Modbus registers/coils
  camera_map :
    camera1 : 0
    camera2 : 1
    camera3 : 2
    camera4 : 3
    camera5 : 4

